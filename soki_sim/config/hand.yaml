# hand_node のパラメータ。
# 実機の数値が変わった/確認が取れた場合は、コードではなくこのファイルを編集すること。
# 各値の根拠はnote/claude.txt「##ハンド」・note/can_mapping.txt「## ハンド」参照。
hand_node:
  ros__parameters:
    can_slots_per_node: 5

    # ---- 吸着パッド展開サーボ (SERVOn、角度[deg]) ----
    # device_id=0は未配線・無効を意味する。実機配線が判明したら
    # note/can_mapping.txtに記入のうえここを書き換えること。
    deploy_servo_device_id: 101
    deploy_servo_node_index: 2
    deploy_servo_local_index: 1   # SERVO1=0/SERVO2=1/SERVO3=2
    deploy_servo_retracted_deg: 0    # 要実測: 収納(搬送)姿勢の角度
    deploy_servo_deployed_deg: 63    # 要実測: 展開(吸着)姿勢の角度
    # 実機のサーボ取付角度と論理角度(retracted_deg/deployed_deg)のズレを
    # 補正するオフセット[deg]。CAN送信にのみ加算される(2026-09-03追加、
    # クランプは行わない)。
    deploy_servo_offset_deg: 0.0
    # 収納/展開の実機送信角度を、上記の論理角度+オフセットの計算式を使わず
    # 直接固定したい場合はtrueにしてXXX_can_degを設定する(2026-09-03新規、
    # 実機との相違を手動補正する用途)。
    deploy_servo_retracted_can_deg_override: true
    deploy_servo_retracted_can_deg: 1.0
    deploy_servo_deployed_can_deg_override: true
    deploy_servo_deployed_can_deg: 63.0

    # ---- ワークピッチ変更サーボ (SERVOn、角度[deg]) ----
    pitch_servo_device_id: 101
    pitch_servo_node_index: 2
    pitch_servo_local_index: 2   # SERVO1=0/SERVO2=1/SERVO3=2
    pitch_servo_hold_deg: 8      # 要実測: ワーク保持(搬送)姿勢の角度
    pitch_servo_insert_deg: 70   # 要実測: シューティングボックス投入姿勢の角度
    # 実機のサーボ取付角度と論理角度(hold_deg/insert_deg)のズレを補正する
    # オフセット[deg]。CAN送信にのみ加算される(RViz表示には影響しない、
    # 2026-09-03追加、クランプは行わない)。
    pitch_servo_offset_deg: 0.0
    # 保持/投入の実機送信角度を直接固定したい場合の手動オーバーライド
    # (deploy_servo_*_can_degと同じ設計、2026-09-03新規)。
    pitch_servo_hold_can_deg_override: true
    pitch_servo_hold_can_deg: 8.0
    pitch_servo_insert_can_deg_override: true
    pitch_servo_insert_can_deg: 70.0

    # ---- ダイヤフラムポンプ (CAN_HOST device_id=101のMD1、符号=方向・絶対値=PWM
    # デューティ。汎用IOノード1台分は SERVO1-3=local0-2, MD1=local3, MD2=local4
    # の並び(ros2can/ros2can/device_profiles.py _append_generic_io_node_channels
    # 参照。ENC1/ENC2が不使用になった枠をMD出力へ転用しており、config.hppは
    # ENC1_MD=1/ENC2_MD=1で両方とも既にMD出力モード)。2026-09-07、ユーザー確認:
    # 「ダイヤフラムがCAN101のMD1に接続されているはず」 ----
    pump_device_id: 101
    pump_node_index: 0   # ホスト自身(xiao-esp32-s3_can2io)= node0
    pump_local_index: 3   # MD1
    pump_duty_percent: 50.0
    pump_md_pwm_max: 255   # config.hppのMD_PWM_RESOLUTION(既定8bit)から算出

    # ---- 真空破壊リレー (MD2のDIRピンをリレー駆動信号として流用、2026-09-07新規)
    # ワークを離す際の真空破壊にリレーを使い、そのリレーをMD2の方向ピンで
    # 代用する計画(ユーザー確認)。MD2のPWM出力自体は未配線で無視されるため、
    # duty量は符号(DIR)を立てられればよい(ros2can/firmware/xiao-esp32-s3_can2io/
    # src/pin_ctrl_task.cpp IO_MD_Output: digitalWrite(MD2D, md2>0 ? HIGH : LOW)は
    # デューティ量と無関係に符号だけで決まる)。ポンプON中はリレーOFF(閉、真空保持)、
    # ポンプOFF時はリレーON(開、真空破壊)という連動で駆動する
    # (独立サービスにはせず_on_pump_on/_on_pump_offの中で一緒に送る)。 ----
    vacuum_release_device_id: 101
    vacuum_release_node_index: 0   # ホスト自身(xiao-esp32-s3_can2io)= node0、pumpと同じCAN_HOST
    vacuum_release_local_index: 4   # MD2
    vacuum_release_duty_percent: 50.0   # DIRピンのみ使うため量自体は無関係(符号だけ意味を持つ)

    # ---- 状態表示灯(黄色/赤色LED、CAN_HOST device_id=101のMULTI1/MULTI2、
    # 2026-09-08追加)。ファームウェアはsoki_host_led_101(MULTI1/MULTI2=2の
    # デジタル出力モード、CanIoRxData[0]/[1]の非ゼロでHIGH)を使用。pump/
    # vacuum_releaseと同じdevice_id=101・node_index=0(汎用IOノードのSERVO1/
    # SERVO2=local0/local1)のため、CAN送信バッファはhand_node内で共有される
    # (note/note_soki/can_mapping.txt「## 状態表示灯」参照)。 ----
    led_device_id: 101
    led_node_index: 0   # ホスト自身(xiao-esp32-s3_can2io)= node0、pump/vacuum_releaseと同じCAN_HOST
    led_yellow_local_index: 0   # SERVO1=MULTI1
    led_red_local_index: 1      # SERVO2=MULTI2
