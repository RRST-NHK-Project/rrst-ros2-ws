; ESP32(Seeed XIAO ESP32-S3 + MCP2561 CANトランシーバ)側:
; PCとの52バイトフレーム(USBシリアル) <-> Damiao CANプロトコル(TWAI)ブリッジ。
;
; RRST-NHK-Project/ros2can の firmware/xiao-esp32-s3_can2io と同じボード
; (XIAO ESP32-S3 + MCP2561, BOARD_SOKI相当のCAN_TX=D1/CAN_RX=D2配線)を前提とする。

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
