# R2 Diagnostics Configuration

diagnostics:
  # Publish interval (seconds)
  publish_interval: 10.0
  
  # Hardware components to test
  hardware:
    motors:
      enabled: true
      count: 8
      timeout: 0.5
    
    servos:
      enabled: true
      count: 8
      timeout: 0.5
    
    solenoids:
      enabled: true
      count: 7
      timeout: 0.5
  
  # Sensor monitoring
  sensors:
    encoders:
      enabled: true
      devices:
        - id: "left"
          min_limit: 0
          max_limit: 100000
        - id: "right"
          min_limit: 0
          max_limit: 100000
    
    switches:
      enabled: true
      devices:
        - id: "micro1"
        - id: "micro2"
    
    imu:
      enabled: false
    
    lidar:
      enabled: false
    
    camera:
      enabled: false
  
  # Report settings
  report:
    save_reports: true
    report_directory: "~/.ros/diagnostics_reports"
    report_format: "json"  # json or yaml
    retention_days: 30
  
  # Joystick control
  joystick:
    enabled: true
    trigger_button_lb: 4
    trigger_button_rb: 5

# ROS 2 node configuration
ros2:
  node_name: "r2_diagnostics_node"
  namespace: "/r2"
  
  # Topic remappings
  remappings:
    - from: "serial_rx_7"
      to: "/serial_rx_7"
    - from: "joy"
      to: "/joy"
  
  # Published topics
  publishers:
    diagnostics:
      topic: "/diagnostics"
      queue_size: 10
    diagnostics_text:
      topic: "/r2/diagnostics_text"
      queue_size: 10
  
  # Services
  services:
    run_diagnostics: "/r2/run_diagnostics"
    run_hardware_diagnostics: "/r2/run_hardware_diagnostics"
    save_diagnostics_report: "/r2/save_diagnostics_report"
