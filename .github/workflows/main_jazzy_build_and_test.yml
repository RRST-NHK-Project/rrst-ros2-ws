# Github上でのCI/CDを使用して、ROS 2 Jazzyのビルドを行うためのGitHub Actionsワークフロー
# 2025/10/28:高速化のため、公式ROSイメージを使用するように変更
name: ROS 2 Jazzy Build

on:
  push:
    branches: [main, develop]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']

jobs:
  jazzy-build:
    runs-on: ubuntu-24.04

    container:
      image: ros:jazzy  # 公式ROSイメージで高速化
      options: --user root

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # ① APTキャッシュ：依存関係のダウンロードをスキップ
      # ------------------------------------------------------------
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('**/package.xml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # ------------------------------------------------------------
      # ② rosdepキャッシュ：依存解決をスキップ
      # ------------------------------------------------------------
      - name: Cache rosdep
        uses: actions/cache@v4
        with:
          path: /root/.ros/rosdep
          key: ${{ runner.os }}-rosdep-${{ hashFiles('**/package.xml') }}
          restore-keys: |
            ${{ runner.os }}-rosdep-

      # ------------------------------------------------------------
      # ③ colconビルドキャッシュ：再ビルドをスキップ
      # ------------------------------------------------------------
      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            ros2_ws/build
            ros2_ws/install
            ros2_ws/log
          key: colcon-${{ hashFiles('**/CMakeLists.txt', '**/package.xml') }}
          restore-keys: |
            colcon-

      # ------------------------------------------------------------
      # ④ 依存関係インストール
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip
          pip install --upgrade pip

      # ------------------------------------------------------------
      # ⑤ ワークスペース作成＋依存解決
      # ------------------------------------------------------------
      - name: Prepare workspace
        shell: bash
        run: |
          mkdir -p ros2_ws/src
          shopt -s extglob
          mv !(ros2_ws) ros2_ws/src/ || true
          cd ros2_ws
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      # ------------------------------------------------------------
      # ⑥ ビルド（高速・静かな出力）
      # ------------------------------------------------------------
      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --symlink-install --event-handlers console_cohesion+