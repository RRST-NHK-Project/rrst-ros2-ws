robstride_driver_node:
  ros__parameters:
    device_id: 202             # ESP32ファームウェア(ros2can MODE_ROBSTRIDE)のDEVICE_IDと一致させる
    motor_index: 0
    cmd_timeout_sec: 0.5       # cmdがこの時間届かないと自動でDISABLE
    feedback_timeout_sec: 0.5  # モータ帰還がこの時間途絶えたらfeedback_ok=0にして警告
    max_vel_radps: 20.0        # 速度の上限[rad/s]。24V電源での頭打ち(約23.5rad/s)の手前。実測後に見直す
    publish_rate_hz: 50.0

ps4_teleop_node:
  ros__parameters:
    # 番号はdamiao_ctrlで2026-10-14実機確認済み(DualShock 4 USB有線, joy 3.3.0, 軸8本・ボタン13個)
    velocity_axis_index: 1     # 左スティック上下(上に倒すと正転)
    deadman_button_index: 5    # R1(押している間だけ動く)
    estop_button_index: 9      # Options(E-STOP)
    max_vel_radps: 1.0         # スティックを倒し切った時の速度[rad/s]。初回は控えめ。慣れたら上げる(上限はdriverのmax_vel_radps)
    deadzone: 0.08
    invert_axis: false         # 回転方向を逆にしたい時はtrue
    joy_timeout_sec: 0.5       # /joyがこの時間途絶えたら停止
    motor_number: 1
