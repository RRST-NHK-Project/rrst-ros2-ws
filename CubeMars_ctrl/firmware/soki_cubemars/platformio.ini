; PlatformIO Project Configuration File
;
; CubeMars_ctrl用ファーム(soki基板 / XIAO ESP32-S3)。
; ros2can/generated_firmware/soki_ak_11 をベースに、動作モードを環境(env)で
; 切り替えられるようにしてある。config.hppのモード行を手で書き換える必要は無い。
;
;   通常運用(ROSからモータを動かす):
;     pio run -e cubemars -t upload
;   CAN ID調査(受信専用。モータへは何も送信しない):
;     pio run -e can_monitor -t upload
;     pio device monitor
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cubemars

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:cubemars]
build_flags =
    ${env.build_flags}
    -DMODE_CUBEMARS

[env:can_monitor]
build_flags =
    ${env.build_flags}
    -DMODE_CAN_MONITOR
    -DCAN_MONITOR_SUMMARY_ENABLE=0
